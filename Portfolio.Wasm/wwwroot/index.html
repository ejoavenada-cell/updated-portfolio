<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erick John | .NET 10 & Blazor Full-Stack Engineer</title>
    <base href="/" />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN for JIT styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#05070B',
                        deepNavy: '#0A0F1D',
                        midnightNavy: '#111A2E',
                        electricCyan: '#00F0FF',
                        royalBlue: '#2563EB'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Portfolio.Wasm.styles.css" rel="stylesheet" />
</head>

<body class="bg-[#05070B] text-slate-100 antialiased selection:bg-[#00F0FF]/30 selection:text-white">
    <div id="app">
        <!-- Cyber-Navy WASM Terminal Preloader -->
        <div class="wasm-loader-container">
            <div class="wasm-loader-box">
                <div class="flex items-center justify-between mb-4 border-b border-[#00F0FF]/20 pb-3">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
                        <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                        <span class="w-3 h-3 rounded-full bg-emerald-500/80"></span>
                    </div>
                    <span class="text-xs text-[#00F0FF] font-mono tracking-wider font-semibold">KERNEL v10.0 // AOT_WASM</span>
                </div>

                <div class="my-4">
                    <div class="text-2xl font-bold tracking-tight font-sans text-white mb-1">
                        ERICK JOHN
                    </div>
                    <div class="text-xs font-mono text-slate-400">
                        BOOTING .NET 10 WEB RUNTIME...
                    </div>
                </div>

                <!-- Live Progress Bar tied to Blazor's --blazor-load-percentage -->
                <div class="wasm-progress-bar-bg">
                    <div class="wasm-progress-bar-fill"></div>
                </div>

                <div class="flex justify-between items-center text-xs font-mono text-slate-500 mt-2">
                    <span class="pulse-text text-[#00F0FF]">INITIALIZING RUNTIME</span>
                    <span class="text-[#00F0FF]/80">STANDALONE WASM</span>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden">
        An unhandled error has occurred.
        <a href="." class="reload text-[#00F0FF] underline">Reload</a>
        <span class="dismiss cursor-pointer ml-2">🗙</span>
    </div>

    <script>
        window.registerCommandPaletteShortcut = (dotNetHelper) => {
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    dotNetHelper.invokeMethodAsync('ToggleCommandPalette');
                }
            });
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
