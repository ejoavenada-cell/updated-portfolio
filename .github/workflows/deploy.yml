name: Build & Verify Blazor WebAssembly

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Portfolio.Wasm/Portfolio.Wasm.csproj

    - name: Build
      run: dotnet build Portfolio.Wasm/Portfolio.Wasm.csproj --no-restore -c Release

    - name: Publish
      run: dotnet publish Portfolio.Wasm/Portfolio.Wasm.csproj -c Release -o dist
